name: Android APK (Capacitor)

# REF-CAP-01 — workflow NOVO, independente de ci.yml (nao altera o pipeline existente).
# Motivo de existir: esta maquina de desenvolvimento nao tem Java/Android SDK/Gradle instalados (ver
# D4 no ADR) - runners ubuntu-latest do GitHub ja vem com Android SDK pre-instalado, so falta o JDK
# (setup-java abaixo) para compilar de verdade. Gatilho manual (workflow_dispatch) de proposito: esta e'
# a PRIMEIRA vez que o codigo Java desta REF (NativePrintPlugin.java) e' realmente compilado - antes de
# confiar num gatilho automatico a cada push, queremos ver o resultado de uma execucao deliberada.
#
# Gera um APK DEBUG (assinado com a keystore de debug padrao do Android, gerada automaticamente pelo
# Gradle) - suficiente para instalar e testar num aparelho fisico via `adb install`/download direto.
# Um APK release assinado (keystore propria + secrets) fica fora do escopo desta onda.

on:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # REF-CAP-01: achado do dono na homologacao fisica - o APK abria com o catalogo MOCK (categorias/
      # produtos de fallback, ver src/data/mockCatalog.js), nao o catalogo real. Causa raiz confirmada por
      # execucao real do bundle: VITE_SUPABASE_URL/VITE_SUPABASE_KEY nunca eram passadas a este step, entao
      # createClient() falhava ("supabaseUrl is required") e lib/supabase.js/dbCliente.js degradavam pra
      # null (comportamento CORRETO e intencional do codigo pra ambiente sem credencial - o bug era so' a
      # ausencia delas aqui). Mesmo padrao ja usado pelo job e2e do ci.yml (secrets -> env do Vite).
      - name: Build web (modo Capacitor - base:'/', sem Service Worker, ver vite.config.js)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: npm run build:capacitor

      - name: Sincronizar Capacitor -> projeto Android
        run: npx cap sync android

      - name: Java (JDK 21 - exigido pelo AGP 8.13/capacitor.build.gradle, ver D3 no ADR)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Permissão de execução do Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Gerar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # REF-CAP-01: achado do dono na homologacao fisica ("Ocorreu um problema ao analisar o pacote").
      # `./gradlew assembleDebug` retornar sucesso NAO prova que o .apk resultante e' de fato parseavel
      # pelo instalador do Android - este step valida isso de verdade, com as MESMAS ferramentas que o
      # Android usa por baixo (aapt/aapt2 + apksigner, do proprio Android SDK ja pre-instalado no runner),
      # ANTES do upload. Falha o job (exit != 0) se o APK nao passar - vira gate automatico, nao so' log.
      - name: Validar integridade do APK (aapt dump badging + apksigner verify)
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "--- arquivo ---"
          ls -la "$APK"
          echo "--- sha256 ---"
          sha256sum "$APK"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          echo "build-tools: $BUILD_TOOLS"

          echo "--- aapt dump badging (confirma que o pacote e' parseavel) ---"
          if [ -x "${BUILD_TOOLS}aapt" ]; then
            "${BUILD_TOOLS}aapt" dump badging "$APK"
          else
            "${BUILD_TOOLS}aapt2" dump badging "$APK"
          fi

          echo "--- apksigner verify (confirma assinatura valida) ---"
          "${BUILD_TOOLS}apksigner" verify --print-certs -v "$APK"

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: encanto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
