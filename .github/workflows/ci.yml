name: CI

# REF-CI-01 — protege a qualidade do projeto automaticamente a cada push/PR para main.
# 5 jobs INDEPENDENTES (rodam em paralelo, nenhum depende do outro):
#   - lint:          ESLint + typecheck (REF-DEVEX-01). Erro de lint quebra o job; typecheck hoje não
#                    verifica nada por padrão (checkJs:false, opt-in por arquivo via `// @ts-check`),
#                    mas fica pronto pra pegar regressão assim que algum arquivo ligar o check.
#   - build:         npm ci + vite build. Sem segredos (VITE_SUPABASE_URL/KEY ausentes não falham o
#                    build — só geram um aviso; lib/supabase.js já degrada para db=null em runtime).
#   - domain-tests:  os ~26 scripts de domínio (tests/*.mjs) via `npm run test:domain` — puramente
#                    lógicos/estáticos, zero credencial, zero rede.
#   - e2e:           suíte Playwright completa contra o projeto Supabase DEDICADO a testes (nunca
#                    produção — mesmo projeto usado localmente, REF-E2E-01). Sem os secrets
#                    E2E_SUPABASE_* configurados no repo, os specs `@writes` apenas pulam
#                    (test.skip(!E2E_ENV_PRONTO)) e os `@read-only` seguem rodando contra o catálogo
#                    MOCK — o job não fica vermelho por falta de secrets, só com cobertura reduzida.
#   - lighthouse:    mede performance/a11y/best-practices/SEO do build (REF-CI-02) contra o MESMO
#                    projeto E2E dedicado (reaproveita os secrets acima) — sem eles, o app cai no
#                    estado degradado (catálogo vazio) e o score de performance fica artificialmente
#                    ruim (confirmado localmente: 27/100 vazio vs. score normal com catálogo real).
#                    SEM asserts/thresholds ainda — só coleta e sobe o relatório como artifact; os
#                    thresholds ficam para a REF-PERF-02 decidir, com baseline medida dentro do CI.
#
# DELIBERADAMENTE FORA deste pipeline automático: os guards que exigem conexão direta ao Postgres de
# PRODUÇÃO (test:f1b, test:rls, test:orders-rls, test:auth-rls, verify:norm05, guard:slug —
# agrupados em `npm run test:db-guards`). Expor credenciais de produção a um workflow que roda em
# todo push/PR (inclusive de forks) é um risco desproporcional ao ganho — permanecem uma suíte local,
# rodada manualmente pelo dono (ver docs/adr/REF-CI-01-pipeline.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck (tsc, opt-in por arquivo)
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

  domain-tests:
    name: Testes de domínio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Suíte de domínio (pricing/addons/checkout/catalog/loyalty/address/comanda/whatsapp/...)
        run: npm run test:domain

  e2e:
    name: E2E (Playwright · Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Cache dos navegadores do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegador (Chromium) + dependências de sistema
        run: npx playwright install --with-deps chromium

      - name: Preparar .env.e2e (projeto Supabase dedicado a testes — nunca produção)
        env:
          E2E_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # FIX (achado no 1o/2o run desta REF, ver docs/ref/REF-CI-01-progress.md): sem os secrets, a
          # URL/KEY viravam string vazia -> createClient('','') lanca erro SINCRONO ("supabaseUrl is
          # required") -> dbCliente/db ficam null -> qualquer teste que dependa deles (mesmo so' pra
          # disparar um fetch que o Playwright intercepta via page.route) trava esperando uma tela que
          # nunca muda, ate' o timeout de 30s (nao falha rapido, nem com erro claro). Fallback abaixo
          # garante createClient() SEMPRE bem-sucedido (URL/key sintaticamente validos, mesmo que
          # falsos) - o que precisa mesmo dos dados REAIS semeados no projeto dedicado (catalog/search/
          # cart/checkout-guest com PROD_MARMITA_P) continua dependendo dos secrets reais configurados.
          cat > .env.e2e <<EOF
          VITE_SUPABASE_URL=${E2E_URL:-https://e2e-mock.supabase.co}
          VITE_SUPABASE_KEY=${E2E_ANON_KEY:-e2e-mock-anon-key}
          VITE_RPC_TIMEOUT=12000
          VITE_STORE_URL=/encanto/
          E2E_SUPABASE_SERVICE_ROLE_KEY=${E2E_SERVICE_ROLE_KEY}
          EOF

      - name: Suíte E2E completa
        run: npm run test:e2e

      - name: Upload do relatório Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar .env (projeto Supabase dedicado a testes — nunca produção, mesmos secrets do job e2e)
        env:
          E2E_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${E2E_URL:-https://e2e-mock.supabase.co}
          VITE_SUPABASE_KEY=${E2E_ANON_KEY:-e2e-mock-anon-key}
          EOF

      - name: Build de produção
        run: npm run build

      - name: Lighthouse CI (mobile, throttling simulado — mesma metodologia da REF-PERF-01)
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.cjs

      - name: Upload do relatório Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
