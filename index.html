<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<!-- REF-MOBILE-01 Onda 3: viewport-fit=cover ativa os env(safe-area-inset-*) ja usados em ScreenModal/SideDrawer/Toast (antes sempre resolviam 0, sem viewport-fit). maximum-scale removido (travava pinch-zoom - falha de acessibilidade WCAG 1.4.4), initial-scale=1 preservado. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Encanto – Açaí & Marmitas</title>
<meta name="description" content="Encanto – Açaí & Marmitas: cardápio completo, entrega, retirada e programa de fidelidade. Peça online, direto do navegador."/>
<link rel="canonical" href="https://valionsistemas.com.br/encanto"/>
<!-- REF-MOBILE-01 Onda 1: Web App Manifest — id/start_url/scope = "/encanto/" (mesmo sub-path servido pelo rewrite institucional, ver docs/adr/REF-BRAND-01) -->
<link rel="manifest" href="/encanto/manifest.json"/>
<!-- REF-MOBILE-01 Onda 2: favicons + apple-touch-icon, gerados a partir de public/icon-encanto.png (simbolo isolado, sem texto).
     Nomes com sufixo "-valion-v2" (cache-busting FISICO, nao query string): navegadores cacheiam favicon por
     URL de forma persistente, ignorando Cache-Control/Etag (achado real: apos o ajuste de recorte do icone,
     o favicon antigo continuou aparecendo mesmo em janela anonima, com o servidor ja confirmadamente
     servindo o arquivo novo). Renomear o arquivo forca o navegador a tratar como recurso nunca visto. -->
<link rel="icon" href="/encanto/favicon-valion-v2.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="/encanto/favicon-valion-32-v2.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/encanto/favicon-valion-16-v2.png"/>
<link rel="apple-touch-icon" href="/encanto/apple-touch-icon-valion-v2.png"/>
<!-- REF-MOBILE-01 Onda 3: theme-color (chrome do navegador/status bar) + tags Apple para o app rodar em standalone (sem barra de endereço) quando adicionado a tela inicial do iOS -->
<meta name="theme-color" content="#6B1F5D"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Encanto"/>
<!-- Open Graph / Twitter Card: preview ao compartilhar o link (WhatsApp/Instagram/etc.) -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Encanto – Açaí & Marmitas"/>
<meta property="og:title" content="Encanto – Açaí & Marmitas"/>
<meta property="og:description" content="Cardápio completo, entrega, retirada e programa de fidelidade. Peça online, direto do navegador."/>
<meta property="og:url" content="https://valionsistemas.com.br/encanto"/>
<meta property="og:image" content="https://valionsistemas.com.br/encanto/logo.jpg"/>
<meta property="og:locale" content="pt_BR"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Encanto – Açaí & Marmitas"/>
<meta name="twitter:description" content="Cardápio completo, entrega, retirada e programa de fidelidade. Peça online, direto do navegador."/>
<meta name="twitter:image" content="https://valionsistemas.com.br/encanto/logo.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="dns-prefetch" href="https://hvbcdxsagkjtfjwvnslo.supabase.co">
<!-- REF-PERF-01: images.unsplash.com preconnect removido — so' e' referenciado no fallback MOCK
     (src/data/mockCatalog.js, usado quando o Supabase esta' offline); no caminho normal (produtos reais
     no Supabase Storage) essa conexao nunca era usada, so' gastava tempo de boot com DNS/TCP/TLS a toa. -->
<!-- REF-PERF-01: preload do banner do header (--header-bg-url em StoreApp.jsx) — sem isto, o navegador
     so' descobre essa imagem depois do JS montar e aplicar o style inline (a URL vem de uma custom
     property, invisivel ao HTML parser). fetchpriority=high pois e' o maior candidato a LCP da loja.
     Caminho fixo em /encanto/ (mesmo padrao ja usado pelo manifest/favicons acima — so' a build web
     serve este HTML por esse caminho; Admin/Capacitor nao usam .header, preload vira no-op ali). -->
<link rel="preload" as="image" href="/encanto/header-bg.webp" fetchpriority="high"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="root">
  <div id="enc-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:10px;font-family:sans-serif;color:#6B21A8">
    <div style="width:40px;height:40px;border:4px solid #E9D5FF;border-top-color:#6B21A8;border-radius:50%;animation:s .8s linear infinite"></div>
    <span>Carregando Encanto...</span>
    <style>@keyframes s{to{transform:rotate(360deg)}}</style>
  </div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
