<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Encanto Admin</title>
<!-- REF-ADMIN-04: superficie administrativa nunca deve ser indexada/rastreada — reforca a invisibilidade
     que e' o proprio objetivo desta REF (nao depende so' de ninguem linkar pra ca). -->
<meta name="robots" content="noindex, nofollow"/>
<!-- REF-ADMIN-04 Onda 2: manifest PROPRIO do admin (scope/start_url/id="/" — raiz do SEU dominio,
     nunca "/encanto/") - instalavel como PWA independente da loja, nome/icone proprios na tela
     inicial. Icones reaproveitados dos mesmos arquivos da loja por ora (nenhum ativo visual distinto
     foi fornecido ainda) - pendencia de design registrada no ADR, nao bloqueia a arquitetura. -->
<link rel="manifest" href="/manifest-admin.json"/>
<link rel="icon" href="/favicon-valion-v2.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-valion-32-v2.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-valion-16-v2.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon-valion-v2.png"/>
<meta name="theme-color" content="#6B1F5D"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Encanto Admin"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="dns-prefetch" href="https://hvbcdxsagkjtfjwvnslo.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="root">
  <div id="enc-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:10px;font-family:sans-serif;color:#6B21A8">
    <div style="width:40px;height:40px;border:4px solid #E9D5FF;border-top-color:#6B21A8;border-radius:50%;animation:s .8s linear infinite"></div>
    <span>Carregando Encanto Admin...</span>
    <style>@keyframes s{to{transform:rotate(360deg)}}</style>
  </div>
</div>
<script type="module" src="/src/admin-main.jsx"></script>
</body>
</html>
